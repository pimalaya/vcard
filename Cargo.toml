[package]
name = "vcard-rs"
description = "vCard (2.1, 3.0, 4.0): a byte-faithful syntax tree and a decoded model"
version = "0.0.1"
authors = ["soywod <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
categories = ["data-structures", "parser-implementations", "encoding"]
keywords = ["vcard", "contact", "carddav", "rfc6350", "codec"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/vcard-rs/latest/vcard-rs"
repository = "https://github.com/pimalaya/vcard-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["parser", "quoted-printable", "base64", "encoding"]
parser = ["dep:memchr"]
quoted-printable = ["dep:quoted_printable"]
base64 = ["dep:base64"]
encoding = ["dep:encoding_rs"]

[dependencies]
memchr = { version = "2", default-features = false, optional = true }
quoted_printable = { version = "0.5", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"], optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
criterion = "0.5"
# Peer parsers, for the comparative parse benchmark. calcard and vcard_parser
# build a decoded model (compared against our parse + decode); ical_vcard is a
# content-line parser (compared against our CST). The `vcard` crate is
# builder-only, so it has no parse path to compare.
calcard = "0.3"
vcard_parser = "0.2"
ical_vcard = "0.4"
vparser = "1"

[lib]
name = "vcard"
path = "src/lib.rs"

[[bench]]
name = "parse"
harness = false
