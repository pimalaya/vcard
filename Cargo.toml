[package]
name = "vcard-rs"
description = "vCard (2.1, 3.0, 4.0): a byte-faithful syntax tree and a decoded model"
version = "0.0.1"
authors = ["soywod <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
categories = ["data-structures", "parser-implementations", "encoding"]
keywords = ["vcard", "contact", "carddav", "rfc6350", "codec"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/vcard-rs/latest/vcard-rs"
repository = "https://github.com/pimalaya/vcard-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["v2_1", "v3_0", "v4_0", "parser"]
v4_0 = []
v3_0 = []
v2_1 = []
parser = ["dep:memchr"]

[lib]
name = "vcard"
path = "src/lib.rs"

[dependencies]
memchr = { version = "2.8", default-features = false, optional = true }
